[project]
name = "hopwatch"
version = "0.1.0"
description = "Cross-ISP route probe with AS-level enrichment and counterfactual paths."
authors = [{name = "Fernando Bezerra", email = "fernando.devsolutions13@gmail.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "dnspython>=2.4",
]

[project.optional-dependencies]
fancy = [
    "rich>=13",
    "scapy>=2.5",
]

[project.scripts]
hopwatch = "hopwatch.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
